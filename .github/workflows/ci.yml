name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.x"

      - name: Set up Chrome for Testing
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
          install-dependencies: true

      - name: Configure browser test path
        shell: bash
        run: |
          chrome_path="${{ steps.setup-chrome.outputs.chrome-path }}"
          test -x "$chrome_path"
          echo "ORC_CHROME_PATH=$chrome_path" >> "$GITHUB_ENV"
          "$chrome_path" --version

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Browser test
        run: node tests/docs_index_browser_test.mjs
        env:
          # Isolated hosted runner; only the repository's local test page is loaded.
          ORC_CHROME_NO_SANDBOX: "1"

      - name: Test
        run: uv run pytest
        env:
          ORC_SKIP_DOCS_INDEX_BROWSER_TEST: "1"

  windows-python:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: uv sync --frozen
      - name: Verify installed commands
        shell: pwsh
        run: |
          uv run record --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run validate-session --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run analyze --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test Python and static contracts
        run: uv run pytest -q
        env:
          ORC_SKIP_DOCS_INDEX_BROWSER_TEST: "1"
